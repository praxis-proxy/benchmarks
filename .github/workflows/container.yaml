name: Container

# ------------------------------------------------------------------------------
# Workflow Settings
# ------------------------------------------------------------------------------
#
# Builds the Containerfile and smoke-tests the resulting runner image by
# invoking the CLI (`praxis-bench --help`), which must exit cleanly. An
# end-to-end benchmark run additionally needs the host Docker socket and
# network, so it is not exercised here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  # ----------------------------------------------------------------------------
  # Build & Run Container
  # ----------------------------------------------------------------------------

  build-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container image
        run: docker build -t praxis-bench:ci -f Containerfile .

      - name: Smoke-test the runner CLI
        run: docker run --rm praxis-bench:ci --help
