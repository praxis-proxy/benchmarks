name: Setup Rust
description: Install stable Rust toolchain and cache Cargo artifacts

inputs:
  rust-version:
    description: "Stable Rust version to install"
    required: false
    default: "1.96.0"
  components:
    description: "Comma-separated toolchain components (e.g. clippy, llvm-tools-preview)"
    required: false
    default: ""
  cache-suffix:
    description: "Suffix for cache key uniqueness"
    required: false
    default: "cargo"
  cache-target:
    description: "Include target/ directory in cache"
    required: false
    default: "true"
  extra-cache-paths:
    description: "Additional newline-separated paths to cache"
    required: false
    default: ""
  save-always:
    description: "Save cache even on job failure"
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@6190aa5fb88a88ee71c12769924bbe63a9ab152e # 1.96.0
      with:
        toolchain: ${{ inputs.rust-version }}
        components: ${{ inputs.components }}

    - name: Cache Cargo registry and build artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.cache-suffix }}
        cache-targets: ${{ inputs.cache-target }}
        cache-directories: ${{ inputs.extra-cache-paths }}
        cache-on-failure: ${{ inputs.save-always }}
